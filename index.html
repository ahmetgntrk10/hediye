<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050508">
<title>For You — TapVerse</title>
<meta name="description" content="A small gift, written in code.">
<meta property="og:title" content="A small gift, written in code.">
<meta property="og:description" content="Tap to open.">
<style>
:root{--bg:#050508;--mono:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--mono);color:#cfd3e4;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.ui{position:fixed;z-index:5;font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
#top{top:calc(14px + env(safe-area-inset-top));right:14px;display:flex;gap:6px}
.btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#9aa0b8;padding:8px 11px;border-radius:999px;font:inherit;letter-spacing:.14em;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.25s}
.btn:hover,.btn.on{color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.09)}
#credit{left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));text-align:center;color:#fff;opacity:.2;pointer-events:none;font-size:10px;letter-spacing:.2em}
#hint{left:0;right:0;bottom:calc(32px + env(safe-area-inset-bottom));text-align:center;color:#8e93ab;opacity:0;pointer-events:none;transition:opacity 1.2s;font-size:9.5px}
#hint.on{opacity:.45}
#panel{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-46%);width:min(92vw,390px);padding:20px 18px 18px;border-radius:20px;background:rgba(14,14,22,.78);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1)}

#panel h3{margin:0 0 14px;font:600 11px var(--mono);letter-spacing:.2em;color:#fff;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
#panel label{display:block;margin:10px 0 5px;font-size:9.5px;letter-spacing:.18em;color:#80849a;text-transform:uppercase}
#panel input,#panel textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 11px;color:#eef0fa;font:13px var(--mono);outline:none;resize:none;transition:.2s}
#panel input:focus,#panel textarea:focus{border-color:rgba(255,138,0,.6);background:rgba(255,255,255,.07)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{flex:1;min-width:64px;text-align:center;padding:9px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#9aa0b8;font:600 10px var(--mono);letter-spacing:.14em;cursor:pointer;text-transform:uppercase;transition:.2s}
.chip.on{color:#fff;border-color:#ff8a00;background:rgba(255,138,0,.12);box-shadow:0 0 18px rgba(255,138,0,.18)}
.row{display:flex;gap:8px;margin-top:16px}
.act{flex:1;padding:12px 8px;border-radius:12px;border:0;font:700 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.2s}
.act.p{background:linear-gradient(135deg,#ff8a00,#ff1a1a);color:#fff;box-shadow:0 8px 28px rgba(255,60,20,.28)}
.act.s{background:rgba(255,255,255,.07);color:#d8dbea;border:1px solid rgba(255,255,255,.1)}
.act:active{transform:scale(.97)}
#toast{position:fixed;z-index:12;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:9px 14px;border-radius:999px;font:600 10.5px var(--mono);letter-spacing:.14em;opacity:0;pointer-events:none;transition:.3s;text-transform:uppercase}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="top"><button class="btn" id="bSnd">sound off</button><button class="btn" id="bCus">customize</button></div>
<div class="ui" id="hint"></div>
<div class="ui" id="credit">TapVerse &mdash; Crafted with code</div>
<div id="panel" role="dialog" aria-modal="true">
  <h3><span id="pT">customize</span><span class="btn" id="pX" style="padding:6px 10px;cursor:pointer">&times;</span></h3>
  <label id="lTo">for</label><input id="iTo" maxlength="16" autocomplete="off" spellcheck="false">
  <label id="lMsg">message</label><textarea id="iMsg" rows="3" maxlength="160" spellcheck="false"></textarea>
  <label id="lFrom">from</label><input id="iFrom" maxlength="16" autocomplete="off" spellcheck="false">
  <label id="lG">gift</label>
  <div class="chips" id="chips"></div>
  <div class="row"><button class="act s" id="bPrev">preview</button><button class="act p" id="bShare">copy link</button></div>
</div>
<div id="toast"></div>
<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */

{snd:'sound off',sndOn:'sound on',cus:'customize',tap:'tap anywhere to replay',to:'for',msg:'message',from:'from',gift:'gift',prev:'preview',copy:'copy link',copied:'link copied',title:'customize',defMsg:'This one is for you.',rose:'rose',heart:'heart',star:'star',gem:'gem',sig:'— '};

const scan=document.createElement('canvas');
function resize(){

/* ---------- shape rasterisation ---------- */
const G=(v,a)=>{v=Math.round(clamp(v,0,1)*255);return a===undefined?`rgb(${v},${v},${v})`:`rgba(${v},${v},${v},${a})`};

function petal(g,cx,cy,rx,ry,rot,base,lw){

function leaf(g,x,y,d,s){

  g.beginPath();g.moveTo(0,0);g.bezierCurveTo(30,-75,105,-100,152,-62);g.bezierCurveTo(108,-8,42,14,0,0);g.closePath();g.fill();g.stroke();
  g.strokeStyle=G(.95);g.lineWidth=2.6;g.beginPath();g.moveTo(2,-2);g.quadraticCurveTo(80,-48,148,-62);g.stroke();
  g.lineWidth=1.6;g.strokeStyle=G(.7);for(let i=1;i<6;i++){const t=i/6,px=t*140,py=-t*58-Math.sin(t*3)*10;g.beginPath();g.moveTo(px,py+2);g.lineTo(px+16,py-26+t*12);g.moveTo(px,py+3);g.lineTo(px+14,py+22-t*8);g.stroke()}

function drawRose(g){

  g.strokeStyle=G(.5);g.lineWidth=16;g.beginPath();g.moveTo(180,330);g.bezierCurveTo(166,470,198,630,178,826);g.stroke();
  g.strokeStyle=G(.97);g.lineWidth=4;g.beginPath();g.moveTo(174,336);g.bezierCurveTo(160,470,192,630,172,820);g.stroke();
  g.strokeStyle=G(.2);g.lineWidth=3;g.beginPath();g.moveTo(188,336);g.bezierCurveTo(176,470,208,630,186,820);g.stroke();

  g.fillStyle=G(.45);g.strokeStyle=G(.95);g.lineWidth=3;
  g.beginPath();g.ellipse(180,296,50,34,0,0,TAU);g.fill();g.stroke();

  for(let k=0;k<4;k++){const a=-Math.PI/2+(k-1.5)*.9;petal(g,cx+Math.cos(a)*56,cy+Math.sin(a)*48+22,66,82,a+Math.PI/2,.38,3)}
  petal(g,cx-38,cy+14,56,76,-.28,.52,3);petal(g,cx+40,cy+14,56,76,.28,.52,3);
  petal(g,cx,cy+42,60,58,0,.5,3.2);

function drawHeart(g){
  const W=420,H=390,cx=210,cy=190,s=11.2;
  const path=()=>{g.beginPath();for(let t=0;t<=TAU+.05;t+=.04){const x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));if(t===0)g.moveTo(cx+x*s,cy+y*s);else g.lineTo(cx+x*s,cy+y*s)}g.closePath()};
  path();const gr=g.createRadialGradient(cx-70,cy-70,10,cx,cy,230);gr.addColorStop(0,G(.95));gr.addColorStop(.35,G(.55));gr.addColorStop(1,G(.12));g.fillStyle=gr;g.fill();
  g.strokeStyle=G(1);g.lineWidth=7;g.stroke();

}
function drawStar(g){
  const W=420,H=400,cx=210,cy=208,R=190,r=82,pts=[];
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}

  for(let i=0;i<5;i++){const o=pts[i*2],l=pts[(i*2+9)%10],rr=pts[(i*2+1)%10];g.fillStyle=G(.28+.14*i);poly([o,rr,[cx,cy],l]);g.fill();}

  g.lineWidth=2.5;g.strokeStyle=G(.75);for(let i=0;i<5;i++){g.beginPath();g.moveTo(cx,cy);g.lineTo(pts[i*2][0],pts[i*2][1]);g.stroke()}
  for(let i=0;i<5;i++){g.beginPath();g.moveTo(cx,cy);g.lineTo(pts[i*2+1][0],pts[i*2+1][1]);g.strokeStyle=G(.45);g.stroke()}
  const gl=g.createRadialGradient(cx,cy,2,cx,cy,70);gl.addColorStop(0,G(1));gl.addColorStop(1,G(0));g.fillStyle=gl;g.beginPath();g.arc(cx,cy,70,0,TAU);g.fill();
}
function drawGem(g){
  const cx=210,top=70,gy=140,bot=360,L=40,R=380;
  const P={a:[L+50,top],b:[R-50,top],c:[R,gy],d:[cx,bot],e:[L,gy],m1:[cx-60,top],m2:[cx+60,top],t1:[cx-80,gy],t2:[cx+80,gy]};
  const poly=(arr,f)=>{g.beginPath();arr.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=G(f);g.fill();g.strokeStyle=G(.95);g.lineWidth=3.4;g.stroke()};
  poly([P.a,P.m1,P.t1,P.e],.45);poly([P.m1,P.m2,P.t2,P.t1],.8);poly([P.m2,P.b,P.c,P.t2],.3);

  g.fillStyle=G(1);g.beginPath();g.arc(cx-35,top+34,6,0,TAU);g.fill();
}
function drawEnvelope(g,label){
  const W=432;
  g.fillStyle=G(.12);g.strokeStyle=G(1);g.lineWidth=6;
  g.beginPath();g.roundRect?g.roundRect(10,12,412,252,8):g.rect(10,12,412,252);g.fill();g.stroke();
  g.lineWidth=4.2;g.strokeStyle=G(.9);g.beginPath();g.moveTo(10,12);g.lineTo(216,150);g.lineTo(422,12);g.stroke();
  g.lineWidth=3;g.strokeStyle=G(.55);g.beginPath();g.moveTo(10,264);g.lineTo(182,134);g.moveTo(422,264);g.lineTo(250,134);g.stroke();
  const gr=g.createRadialGradient(216,150,2,216,150,30);gr.addColorStop(0,G(1));gr.addColorStop(1,G(.7));g.fillStyle=gr;g.strokeStyle=G(1);g.lineWidth=3;g.beginPath();g.arc(216,150,25,0,TAU);g.fill();g.stroke();
  g.fillStyle=G(.05);g.beginPath();g.moveTo(216,162);g.bezierCurveTo(196,148,202,134,216,141);g.bezierCurveTo(230,134,236,148,216,162);g.fill();

const SHAPES={
  rose:{W:360,H:840,draw:drawRose,cols:60,rows:84,mx:1000,dz:120},
  heart:{W:420,H:390,draw:drawHeart,cols:70,rows:39,mx:1000,dz:90},
  star:{W:420,H:400,draw:drawStar,cols:70,rows:40,mx:1000,dz:90},
  gem:{W:420,H:400,draw:drawGem,cols:70,rows:40,mx:1000,dz:90},
  env:{W:432,H:380,draw:null,cols:72,rows:38,mx:1000,dz:0}
};
function rasterize(name,label){
  const S=SHAPES[name],[c,g]=mk(S.W,S.H);
  if(name==='env')drawEnvelope(g,label);else S.draw(g);
  const cols=Math.round(S.cols*RES),rows=Math.round(S.rows*RES);
  const t=document.createElement('canvas');t.width=cols;t.height=rows;const tg=t.getContext('2d');tg.imageSmoothingQuality='high';tg.drawImage(c,0,0,cols,rows);
  const d=tg.getImageData(0,0,cols,rows).data,sw=S.mx/Math.max(S.W,name==='rose'?S.H*.62:S.H),cw=S.W/cols*sw,chh=S.H/rows*sw,cells=[];

const shapes={};
function buildShapes(){for(const n of['rose','heart','star','gem'])shapes[n]=rasterize(n);buildEnv()}

/* ---------- particles ---------- */
let P=[],N=0,perm=[];

  for(let i=0;i<N;i++){P.push({x:(rnd()-.5)*2400,y:(rnd()-.5)*2400,z:0,vx:0,vy:0,vz:0,tx:0,ty:0,tz:0,tch:'.',ch:'.',lum:1,a:0,t0:0,fs:10,tfs:10,kind:1,heat:0,hs:rnd(),ang:rnd()*TAU,rad:350+rnd()*500,om:(rnd()<.5?-1:1)*(.06+rnd()*.14),ok:.6+rnd()*.8,tw:rnd()*TAU,set:0,txt:0,sz:rnd()});perm.push(i)}
  for(let i=N-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}

function assign(sh,t0f){
