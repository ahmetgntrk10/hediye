name: Jarvis server test
on:
  push:
    paths: ['server/**', '.github/workflows/jarvis-server-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kur ve dene
        working-directory: server
        run: |
          npm install
          node test/smoke.mjs
