                PendingIntent pi = PendingIntent.getBroadcast(c, 5, new Intent(c, WakeWatch.class), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                am.setAndAllowWhileIdle(android.app.AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + ms, pi);
              } catch (Exception e) {}
            }
            static void ensure(Context c) {
              try {
                if (!c.getSharedPreferences("jarvis", Context.MODE_PRIVATE).getBoolean("wakeOn", false)) return;
                schedule(c, 10 * 60 * 1000L);
                if (running && inst != null) return;
                androidx.core.content.ContextCompat.startForegroundService(c, new Intent(c, WakeService.class));
              } catch (Throwable e) {
                lastError = "arka planda başlatılamadı: " + e.getMessage();
              }
            }
            @Override
            public void onTaskRemoved(Intent rootIntent) {
              schedule(this, 3000L);
