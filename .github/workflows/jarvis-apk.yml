              return START_STICKY;
            }
            private double cosDist(double[] a, double[] b) {
              double d = 0, na = 0, nb = 0;
              int n = Math.min(a.length, b.length);
              for (int i = 0; i < n; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
              if (na == 0 || nb == 0) return 2;
              return 1 - d / (Math.sqrt(na) * Math.sqrt(nb));
            }
            private double[] toVec(JSONArray ja) throws Exception {
              double[] v = new double[ja.length()];
              for (int i = 0; i < v.length; i++) v[i] = ja.getDouble(i);
              return v;
            }
            private void check(String json, boolean partial) {
              if (paused || json == null) return;
              String t = json.toLowerCase();
              events++;
              if (interrupt) {
                String tt = t.replaceAll("\"spk\"\\s*:\\s*\\[[^\\]]*\\]", "");
                if (tt.contains("jarvis") || tt.contains("assist") || tt.contains("stop") || tt.contains("system")) {
                  interrupt = false;
                  OverlayActivity.runJs("window.__stopSpeech&&window.__stopSpeech()");
                }
                return;
              }
              String hh = t.replaceAll("\"spk\"\\s*:\\s*\\[[^\\]]*\\]", "").replaceAll("[^a-z\\[\\] ]", "").replace("partial", "").replace("text", "").replace("spkframes", "").trim();
              if (hh.length() > 0) heard = hh;
              boolean hit = t.contains("jarvis") || ((t.contains("hey") || t.contains("hay")) && (t.contains("assist") || t.contains("a system") || t.contains("asistan")));
              if (!hit) return;
              SharedPreferences sp = getSharedPreferences("jarvis", Context.MODE_PRIVATE);
              boolean spkOnly = sp.getBoolean("spkOnly", false);
              String stored = sp.getString("spk", "[]");
              JSONArray all;
              try { all = new JSONArray(stored); } catch (Exception e) { all = new JSONArray(); }
              if (enrolling) {
                if (partial) return;
                try {
                  JSONObject o = new JSONObject(json);
                  JSONArray v = o.optJSONArray("spk");
                  if (v == null) { lastError = "ses izi alınamadı, tekrar söyle"; return; }
                  all.put(v);
                  sp.edit().putString("spk", all.toString()).apply();
                  enrollCount = all.length();
                  lastError = "";
                } catch (Exception e) { lastError = "ses kaydı hatası: " + e.getMessage(); }
                return;
              }
              if (spkOnly && all.length() > 0) {
                if (partial) return;
                try {
                  JSONObject o = new JSONObject(json);
                  JSONArray v = o.optJSONArray("spk");
                  if (v == null) { lastError = "ses izi yok, açılmadı"; return; }
                  double[] cur = toVec(v);
                  double best = 2;
                  for (int i = 0; i < all.length(); i++) {
                    double d = cosDist(cur, toVec(all.getJSONArray(i)));
                    if (d < best) best = d;
                  }
                  lastDist = String.format(java.util.Locale.US, "%.2f", best);
                  if (best > 0.6) { lastError = "ses tanınmadı (fark " + lastDist + ")"; return; }
                  lastError = "";
                } catch (Exception e) { lastError = "ses karşılaştırma hatası: " + e.getMessage(); return; }
              } else if (partial) {
                try {
                  android.media.AudioManager am = (android.media.AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  if (am != null && am.isMusicActive()) return;
                } catch (Exception e) {}
              }
              long now = System.currentTimeMillis();
              if (now - lastWake < 2500) return;
              lastWake = now;
              onWake();
            }
            private void onWake() {
              pause(true);
              try {
                Intent i = new Intent(this, OverlayActivity.class);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                startActivity(i);
                new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() {
                  public void run() {
                    if (!OverlayActivity.alive) {
                      lastError = "panel açılamadı: telefon engelledi (Arka planda açılır pencere izni)";
                      pause(false);
                    }
                  }
                }, 3000);
              } catch (Exception e) {
                lastError = "panel açılamadı: " + e.getMessage();
                pause(false);
              }
            }
            @Override public void onPartialResult(String h) { check(h, true); }
            @Override public void onResult(String h) { check(h, false); }
            @Override public void onFinalResult(String h) { check(h, false); }
            @Override public void onError(Exception e) { lastError = "ses hatası: " + e.getMessage(); }
            @Override public void onTimeout() {}
            @Override
            public void onDestroy() {
              stopListen();
              try { if (anchor != null) { ((android.view.WindowManager) getSystemService(Context.WINDOW_SERVICE)).removeView(anchor); anchor = null; } } catch (Throwable e) {}
              try { if (model != null) model.close(); } catch (Exception e) {}
              model = null;
              running = false;
              inst = null;
              super.onDestroy();
            }
          }
