              w.addFlags(WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL | WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH);
              try { getBridge().getWebView().setBackgroundColor(Color.TRANSPARENT); } catch (Exception e) {}
              try { getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false); } catch (Exception e) {}
            }
            @Override
            public boolean onTouchEvent(MotionEvent e) {
              if (e.getAction() == MotionEvent.ACTION_OUTSIDE) { if (!keep) finish(); return true; }
              return super.onTouchEvent(e);
            }
            @Override
            public void onDestroy() {
              super.onDestroy();
              alive = false;
              keep = false;
              inst = null;
              WakeService.interrupt = false;
              WakeService.setPaused(false);
            }
          }
