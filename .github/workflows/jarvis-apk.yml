name: Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['jarvis/**', 'jarvis-app/**', '.github/workflows/jarvis-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketleri kur
        working-directory: jarvis-app
        run: npm install

      - name: Web dosyalarini hazirla
        working-directory: jarvis-app
        run: |
          mkdir -p www
          cp ../jarvis/index.html www/index.html

      - name: Android projesi
        working-directory: jarvis-app
        run: |
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.READ_CONTACTS"/><uses-permission android:name="android.permission.CALL_PHONE"/><uses-permission android:name="android.permission.SEND_SMS"/><uses-permission android:name="android.permission.SET_ALARM"/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/><uses-permission android:name="android.permission.FLASHLIGHT"/><uses-feature android:name="android.hardware.camera" android:required="false"/><application#' $M
          grep -n "uses-permission\|screenOrientation" $M

      - name: Ozel eklenti (sayfa yansitma + bip sesini kapatma)
        working-directory: jarvis-app
        run: |
          D=android/app/src/main/java/com/tapverse/jarvis
          mkdir -p $D
          cat > $D/MainActivity.java <<'JAVA'
          package com.tapverse.jarvis;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              registerPlugin(JarvisViewPlugin.class);
              super.onCreate(b);
            }
          }
          JAVA
          cat > $D/JarvisViewPlugin.java <<'JAVA'
          package com.tapverse.jarvis;
          import android.content.Context;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.ArrayList;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.net.Uri;
          import android.provider.AlarmClock;
          import android.provider.ContactsContract;
          import android.provider.Settings;
          import android.telephony.SmsManager;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.util.List;
          @CapacitorPlugin(name = "JarvisView", permissions = {
            @Permission(alias = "contacts", strings = { Manifest.permission.READ_CONTACTS }),
            @Permission(alias = "call", strings = { Manifest.permission.CALL_PHONE }),
            @Permission(alias = "sms", strings = { Manifest.permission.SEND_SMS })
          })
          public class JarvisViewPlugin extends Plugin {
            private WebView wv;
            private ArrayList<Integer> muted = new ArrayList<>();
            @PluginMethod
            public void open(final PluginCall call) {
              final String url = call.getString("url");
              final int top = call.getInt("top", 0);
              final int bottom = call.getInt("bottom", 0);
              final boolean desktop = call.getBoolean("desktop", false);
              getActivity().runOnUiThread(new Runnable() {
                public void run() {
                  try {
                    close0();
                    FrameLayout root = (FrameLayout) getActivity().findViewById(android.R.id.content);
                    float d = getActivity().getResources().getDisplayMetrics().density;
                    wv = new WebView(getContext());
                    WebSettings s = wv.getSettings();
                    s.setJavaScriptEnabled(true);
                    s.setDomStorageEnabled(true);
                    s.setMediaPlaybackRequiresUserGesture(false);
                    if (desktop) {
                      s.setUserAgentString("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");
                      s.setUseWideViewPort(true);
                      s.setLoadWithOverviewMode(true);
                      s.setSupportZoom(true);
                      s.setBuiltInZoomControls(true);
                      s.setDisplayZoomControls(false);
                    }
                    CookieManager.getInstance().setAcceptCookie(true);
                    CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true);
                    wv.setWebViewClient(new WebViewClient());
                    wv.setWebChromeClient(new WebChromeClient());
                    wv.setBackgroundColor(Color.BLACK);
                    FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(-1, -1);
                    lp.topMargin = (int) (top * d);
                    lp.bottomMargin = (int) (bottom * d);
                    wv.setLayoutParams(lp);
                    root.addView(wv);
                    wv.loadUrl(url);
                    call.resolve();
                  } catch (Exception e) {
                    call.reject(String.valueOf(e.getMessage()));
                  }
                }
              });
            }
            @PluginMethod
            public void close(final PluginCall call) {
              getActivity().runOnUiThread(new Runnable() {
                public void run() {
                  close0();
                  call.resolve();
                }
              });
            }
            private void close0() {
              if (wv != null) {
                ViewGroup p = (ViewGroup) wv.getParent();
                if (p != null) p.removeView(wv);
                wv.destroy();
                wv = null;
              }
            }
            @PluginMethod
            public void mute(PluginCall call) {
              int ms = call.getInt("ms", 1100);
              final AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
              int[] st = { AudioManager.STREAM_SYSTEM, AudioManager.STREAM_NOTIFICATION, AudioManager.STREAM_MUSIC };
              for (int s : st) {
                try {
                  if (!am.isStreamMute(s) && !muted.contains(s)) {
                    am.adjustStreamVolume(s, AudioManager.ADJUST_MUTE, 0);
                    muted.add(s);
                  }
                } catch (Exception e) {}
              }
              new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                public void run() {
                  for (int s : muted) {
                    try { am.adjustStreamVolume(s, AudioManager.ADJUST_UNMUTE, 0); } catch (Exception e) {}
                  }
                  muted.clear();
                }
              }, ms);
              call.resolve();
            }
            private static String nrm(String s) {
              if (s == null) return "";
              String t = s.toLowerCase(new java.util.Locale("tr"));
              return t.replace("̇", "").replace("ı", "i").replace("ş", "s").replace("ğ", "g").replace("ü", "u").replace("ö", "o").replace("ç", "c").trim();
            }
            private void fail(PluginCall call, Exception e) { call.reject(String.valueOf(e.getMessage())); }
            private Intent newTask(Intent i) { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); return i; }
            @PluginMethod
            public void perms(PluginCall call) {
              requestPermissionForAliases(new String[] { "contacts", "call", "sms" }, call, "permsCb");
            }
            @PermissionCallback
            private void permsCb(PluginCall call) {
              JSObject o = new JSObject();
              o.put("contacts", getPermissionState("contacts") == PermissionState.GRANTED);
              o.put("call", getPermissionState("call") == PermissionState.GRANTED);
              o.put("sms", getPermissionState("sms") == PermissionState.GRANTED);
              call.resolve(o);
            }
            @PluginMethod
            public void contact(PluginCall call) {
              String q = nrm(call.getString("name", ""));
              if (getPermissionState("contacts") != PermissionState.GRANTED) { call.reject("izin yok"); return; }
              JSArray arr = new JSArray();
              Cursor c = null;
              try {
                c = getContext().getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                  new String[] { ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER },
                  null, null, ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC");
                java.util.HashSet<String> seen = new java.util.HashSet<String>();
                while (c != null && c.moveToNext() && arr.length() < 5) {
                  String n = c.getString(0);
                  String num = c.getString(1);
                  if (n == null || num == null) continue;
                  if (q.length() == 0 || !nrm(n).contains(q)) continue;
                  if (!seen.add(n + "|" + num.replaceAll("\\D", ""))) continue;
                  JSObject o = new JSObject();
                  o.put("name", n);
                  o.put("number", num);
                  arr.put(o);
                }
              } catch (Exception e) { fail(call, e); return; }
              finally { if (c != null) c.close(); }
              JSObject r = new JSObject();
              r.put("list", arr);
              call.resolve(r);
            }
            @PluginMethod
            public void dial(PluginCall call) {
              try {
                boolean direct = getPermissionState("call") == PermissionState.GRANTED;
                Intent i = new Intent(direct ? Intent.ACTION_CALL : Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(call.getString("number", ""))));
                getContext().startActivity(newTask(i));
                JSObject r = new JSObject();
                r.put("direct", direct);
                call.resolve(r);
              } catch (Exception e) { fail(call, e); }
            }
            @PluginMethod
            public void sms(PluginCall call) {
              try {
                String num = call.getString("number", "");
                String text = call.getString("text", "");
                boolean send = call.getBoolean("send", false);
                JSObject r = new JSObject();
                if (send && getPermissionState("sms") == PermissionState.GRANTED) {
                  SmsManager sm = SmsManager.getDefault();
                  sm.sendMultipartTextMessage(num, null, sm.divideMessage(text), null, null);
                  r.put("sent", true);
                } else {
                  Intent i = new Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:" + Uri.encode(num)));
                  i.putExtra("sms_body", text);
                  getContext().startActivity(newTask(i));
                  r.put("sent", false);
                }
                call.resolve(r);
              } catch (Exception e) { fail(call, e); }
            }
            @PluginMethod
            public void alarm(PluginCall call) {
              try {
                Intent i = new Intent(AlarmClock.ACTION_SET_ALARM);
                i.putExtra(AlarmClock.EXTRA_HOUR, call.getInt("hour", 7));
                i.putExtra(AlarmClock.EXTRA_MINUTES, call.getInt("minutes", 0));
                i.putExtra(AlarmClock.EXTRA_MESSAGE, "Jarvis");
                i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                getContext().startActivity(newTask(i));
                call.resolve();
              } catch (Exception e) { fail(call, e); }
            }
            @PluginMethod
            public void timer(PluginCall call) {
              try {
                Intent i = new Intent(AlarmClock.ACTION_SET_TIMER);
                i.putExtra(AlarmClock.EXTRA_LENGTH, call.getInt("seconds", 60));
                i.putExtra(AlarmClock.EXTRA_MESSAGE, "Jarvis");
                i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                getContext().startActivity(newTask(i));
                call.resolve();
              } catch (Exception e) { fail(call, e); }
            }
            @PluginMethod
            public void torch(PluginCall call) {
              try {
                boolean on = call.getBoolean("on", true);
                CameraManager cm = (CameraManager) getContext().getSystemService(Context.CAMERA_SERVICE);
                for (String id : cm.getCameraIdList()) {
                  CameraCharacteristics cc = cm.getCameraCharacteristics(id);
                  Boolean f = cc.get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                  Integer lens = cc.get(CameraCharacteristics.LENS_FACING);
                  if (f != null && f.booleanValue() && lens != null && lens.intValue() == CameraCharacteristics.LENS_FACING_BACK) {
                    cm.setTorchMode(id, on);
                    break;
                  }
                }
                call.resolve();
              } catch (Exception e) { fail(call, e); }
            }
            @PluginMethod
            public void volume(PluginCall call) {
              try {
                AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                int cur = am.getStreamVolume(AudioManager.STREAM_MUSIC);
                int target;
                if (call.hasOption("level")) target = Math.round(call.getInt("level", 50) / 100f * max);
                else target = cur + Math.round(call.getInt("delta", 0) / 100f * max);
                target = Math.max(0, Math.min(max, target));
                am.setStreamVolume(AudioManager.STREAM_MUSIC, target, AudioManager.FLAG_SHOW_UI);
                JSObject r = new JSObject();
                r.put("pct", Math.round(target * 100f / max));
                call.resolve(r);
              } catch (Exception e) { fail(call, e); }
            }
            @PluginMethod
            public void brightness(final PluginCall call) {
              final float lv = call.getFloat("level", 0.5f);
              getActivity().runOnUiThread(new Runnable() {
                public void run() {
                  WindowManager.LayoutParams lp = getActivity().getWindow().getAttributes();
                  lp.screenBrightness = lv;
                  getActivity().getWindow().setAttributes(lp);
                  call.resolve();
                }
              });
            }
            @PluginMethod
            public void media(PluginCall call) {
              try {
                String k = call.getString("key", "play");
                int code = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
                if (k.equals("next")) code = KeyEvent.KEYCODE_MEDIA_NEXT;
                else if (k.equals("prev")) code = KeyEvent.KEYCODE_MEDIA_PREVIOUS;
                else if (k.equals("pause")) code = KeyEvent.KEYCODE_MEDIA_PAUSE;
                else if (k.equals("play")) code = KeyEvent.KEYCODE_MEDIA_PLAY;
                AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
                call.resolve();
              } catch (Exception e) { fail(call, e); }
            }
            @PluginMethod
            public void openApp(PluginCall call) {
              try {
                String q = nrm(call.getString("name", ""));
                PackageManager pm = getContext().getPackageManager();
                List<ApplicationInfo> apps = pm.getInstalledApplications(0);
                ApplicationInfo best = null;
                String bestLabel = "";
                for (ApplicationInfo ai : apps) {
                  if (pm.getLaunchIntentForPackage(ai.packageName) == null) continue;
                  String lab = String.valueOf(pm.getApplicationLabel(ai));
                  String nl = nrm(lab);
                  if (nl.equals(q)) { best = ai; bestLabel = lab; break; }
                  if (q.length() >= 3 && (nl.contains(q) || (nl.length() >= 3 && q.contains(nl))) && best == null) { best = ai; bestLabel = lab; }
                }
                JSObject r = new JSObject();
                if (best != null) {
                  getContext().startActivity(newTask(pm.getLaunchIntentForPackage(best.packageName)));
                  r.put("ok", true);
                  r.put("label", bestLabel);
                } else r.put("ok", false);
                call.resolve(r);
              } catch (Exception e) { fail(call, e); }
            }
            @PluginMethod
            public void settings(PluginCall call) {
              try {
                String p = call.getString("page", "");
                String a = Settings.ACTION_SETTINGS;
                if (p.equals("wifi")) a = Settings.ACTION_WIFI_SETTINGS;
                else if (p.equals("bluetooth")) a = Settings.ACTION_BLUETOOTH_SETTINGS;
                else if (p.equals("location")) a = Settings.ACTION_LOCATION_SOURCE_SETTINGS;
                else if (p.equals("airplane")) a = Settings.ACTION_AIRPLANE_MODE_SETTINGS;
                else if (p.equals("display")) a = Settings.ACTION_DISPLAY_SETTINGS;
                else if (p.equals("sound")) a = Settings.ACTION_SOUND_SETTINGS;
                else if (p.equals("battery")) a = Settings.ACTION_BATTERY_SAVER_SETTINGS;
                getContext().startActivity(newTask(new Intent(a)));
                call.resolve();
              } catch (Exception e) { fail(call, e); }
            }
            @PluginMethod
            public void navigate(PluginCall call) {
              String q = call.getString("q", "");
              try {
                Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("google.navigation:q=" + Uri.encode(q)));
                i.setPackage("com.google.android.apps.maps");
                getContext().startActivity(newTask(i));
                call.resolve();
              } catch (Exception e) {
                try {
                  getContext().startActivity(newTask(new Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=" + Uri.encode(q)))));
                  call.resolve();
                } catch (Exception e2) { fail(call, e2); }
              }
            }
          }
          JAVA
          sed -i 's/^          //' $D/MainActivity.java $D/JarvisViewPlugin.java

      - name: Surum ve sabit imza
        working-directory: jarvis-app
        run: |
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          s=re.sub(r'versionCode\s+\d+','versionCode ${{ github.run_number }}',s)
          s=re.sub(r'versionName\s+"[^"]*"','versionName "1.0.${{ github.run_number }}"',s)
          assert 'buildTypes {' in s
          s=s.replace('buildTypes {',"signingConfigs {\n        debug {\n            storeFile file('../../test.keystore')\n            storePassword 'jarvis123'\n            keyAlias 'jarvis'\n            keyPassword 'jarvis123'\n        }\n    }\n    buildTypes {",1)
          open(p,'w').write(s)
          PY

      - name: APK derle
        working-directory: jarvis-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis.apk

      - name: Surum olarak yayinla (telefondan kolay indirme)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-latest --yes --cleanup-tag || true
          gh release create jarvis-latest jarvis.apk --title "Jarvis son surum" --notes "Test APK. Telefondan indirip kur." --target ${{ github.sha }}
