          public class OverlayActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              registerPlugin(JarvisViewPlugin.class);
              super.onCreate(b);
              WakeService.setPaused(true);
              Window w = getWindow();
              w.setGravity(Gravity.BOTTOM);
              int h = (int) (230 * getResources().getDisplayMetrics().density);
              w.setLayout(ViewGroup.LayoutParams.MATCH_PARENT, h);
              w.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
              w.addFlags(WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL | WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH);
              try { getBridge().getWebView().setBackgroundColor(Color.TRANSPARENT); } catch (Exception e) {}
            }
            @Override
            public boolean onTouchEvent(MotionEvent e) {
              if (e.getAction() == MotionEvent.ACTION_OUTSIDE) { finish(); return true; }
              return super.onTouchEvent(e);
            }
            @Override
            public void onDestroy() {
              super.onDestroy();
              WakeService.setPaused(false);
            }
          }
