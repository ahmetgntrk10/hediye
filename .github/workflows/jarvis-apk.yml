            }
            private synchronized void stopListen() {
              try { if (ss != null) { ss.stop(); ss.shutdown(); } } catch (Exception e) {}
              ss = null;
            }
            private synchronized void startListen() {
              if (model == null || paused || ss != null) return;
              try {
                Recognizer rec = new Recognizer(model, 16000.0f, "[\"hey\", \"hay\", \"assistant\", \"assistance\", \"a system\", \"hey assistant\", \"jarvis\", \"stop\", \"[unk]\"]");
                if (spk != null) { try { rec.setSpeakerModel(spk); } catch (Throwable e2) {} }
                ss = new SpeechService(rec, 16000.0f);
                ss.startListening(this);
                running = true;
                lastError = "";
              } catch (Exception e) {
                running = false;
                lastError = "dinleme başlamadı: " + e.getMessage();
              }
            }
            private android.view.View anchor;
            private void addAnchor() {
              try {
                if (anchor != null || !android.provider.Settings.canDrawOverlays(this)) return;
                android.view.WindowManager wm = (android.view.WindowManager) getSystemService(Context.WINDOW_SERVICE);
                android.view.View v = new android.view.View(this);
                android.view.WindowManager.LayoutParams lp = new android.view.WindowManager.LayoutParams(1, 1,
                  Build.VERSION.SDK_INT >= 26 ? android.view.WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : android.view.WindowManager.LayoutParams.TYPE_PHONE,
                  android.view.WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | android.view.WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE | android.view.WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                  android.graphics.PixelFormat.TRANSLUCENT);
                lp.gravity = android.view.Gravity.TOP | android.view.Gravity.START;
                wm.addView(v, lp);
                anchor = v;
              } catch (Throwable e) {}
            }
            private void copyAssets(AssetManager am, String from, File to) throws Exception {
              String[] list = am.list(from);
              if (list != null && list.length > 0) {
                to.mkdirs();
                for (String n : list) copyAssets(am, from + "/" + n, new File(to, n));
              } else {
                InputStream in = am.open(from);
                OutputStream out = new FileOutputStream(to);
                byte[] buf = new byte[65536];
                int r;
                while ((r = in.read(buf)) > 0) out.write(buf, 0, r);
                out.close();
                in.close();
              }
            }
            private void loadModel() {
              if (model != null || loading) return;
              loading = true;
              new Thread(new Runnable() {
                public void run() {
                  try {
                    File dir = new File(getFilesDir(), "vosk-model");
                    File ok = new File(dir, "ok.flag");
                    if (!ok.exists()) {
                      copyAssets(getAssets(), "model", dir);
                      new FileOutputStream(ok).close();
                    }
                    try {
                      File sdir = new File(getFilesDir(), "vosk-spk");
                      File sok = new File(sdir, "ok.flag");
                      if (!sok.exists()) {
                        copyAssets(getAssets(), "spk", sdir);
                        new FileOutputStream(sok).close();
                      }
                      spk = new SpeakerModel(sdir.getAbsolutePath());
                    } catch (Throwable e3) { spk = null; lastError = "ses modeli yüklenmedi: " + e3.getMessage(); }
                    model = new Model(dir.getAbsolutePath());
                    startListen();
                  } catch (Throwable e) {
                    running = false;
                    lastError = "model yüklenmedi: " + e.getMessage();
                  }
                  loading = false;
                }
